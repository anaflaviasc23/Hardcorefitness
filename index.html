<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>Hardcore Fitness</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
    <link rel="icon" href="IMG_2749.png" type="image/png">

</head>

<body>

  <header>
    <h1>HARDCORE FITNESS</h1>
    <span>Disciplina vence motivação</span>
  </header>

  <main>
    <button onclick="window.location.href='treinos1.html'">
      🏋️ Treinos 1/2025
    </button>
    <button onclick="window.location.href='treinos2.html'">
      🏋️ Treinos 2/2025
    </button>
    <button onclick="window.location.href='treinocal.html'">
      🏋️ Treinos em Casa 
    </button>
    <button onclick="window.location.href='dieta.html'">
      🥗Dieta
    </button>
    <button onclick="abrir('evolucao')">💪🏼 Evolução Pessoal </button>
    <button onclick="abrir('calendario')">📅 Check-in</button>
    <button onclick="window.location.href='teste.html'">
      ⚙️Área teste ⚙️
    </button>


  </main>


  <!-- EVOLUÇÃO -->
  <div class="modal" id="evolucao">
    <h2>Evolução Física</h2>

    <span>Peso:</span>
    <input id="peso" placeholder="Peso (kg)">

    <span>Quadril:</span>
    <input id="quadril" placeholder="Quadril (cm)">

    <span>Perna:</span>
    <input id="perna" placeholder="Perna (cm)">

    <span>Braço:</span>
    <input id="braco" placeholder="Braço (cm)">

    <span>Busto:</span>
    <input id="busto" placeholder="Busto (cm)">

    <span>Barriga:</span>
    <input id="barriga" placeholder="Barriga (cm)">

    <br><br>
    <button onclick="salvarEvolucao()">Salvar Evolução</button>

    <div id="listarEvolucao"></div>
    <br>
    <button class="voltar" onclick="fechar()">Voltar</button>
    <br>
      <div id="listarEvolucao" style="display:none;"></div>
  </div>


  <!-- CHECK-IN -->

  <div class="modal" id="calendario">
    <h2>Check-in do Treino</h2>

    <p id="dataHora"></p>

    <input id="tempoTreino" placeholder="Tempo de treino (horas)">
    <input id="calorias" placeholder="Calorias gastas (kcal)">
    <textarea id="comentario" placeholder="Comentário (opcional)"></textarea>

    <p>Como foi o treino?</p>

    <div class="humor">
      <button onclick="selecionarHumor(this, 'Difícil 😭')">😭 Difícil</button>
      <button onclick="selecionarHumor(this, 'Intenso 🔥')">🔥 Intenso</button>
      <button onclick="selecionarHumor(this, 'Tranquilo 😌')">😌 Tranquilo</button>
      <button onclick="selecionarHumor(this, 'Suave 🥰')">🥰 Suave</button>
    </div>
    <br>
    <button class="salvar" onclick="salvarCheckin()">🔥 Salvar Check-in</button>
    <br>
    <div id="listaDias"></div>
    <br>
    <button class="voltar" onclick="fechar()">Voltar</button>
  
  <br>
    <div id="treinosSalvos"></div>

  </div>


  <script src="script.js"></script>
</body>

</html>
